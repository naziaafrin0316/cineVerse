<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CineVerse</title>
    <link rel="stylesheet" href="./css/register.css">
</head>
<body>

    <header class="navbar">
        <a href="../index.html" class="logo">CineVerse</a>

        <nav>
            <a href="../index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="active">Register</a>
        </nav>
    </header>

    <main class="main-content">
        <form id="register-container">
            <span class="register-badge">CineVerse</span>

            <h1 class="register-title">Create Account</h1>
            <p class="register-description">
                Join CineVerse and book your favorite movies.
            </p>

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    required
                >
            </div>

            <button type="submit" class="submit-button">
                Create Account
            </button>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </form>
    </main>

    <footer class="footer">
        <p>&copy; 2026 CineVerse. All rights reserved.</p>
    </footer>

    <button
        class="back-to-top"
        onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
        aria-label="Back to top"
    >
        ↑
    </button>

</body>
</html>
