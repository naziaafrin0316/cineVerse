<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CineVerse</title>

    <link rel="stylesheet" href="./css/register.css">
</head>

<body>

    <header class="navbar">

        <a href="home.html" class="logo">CineVerse</a>

        <nav>
            <a href="home.html">Home</a>
            <a href="login.html">Login</a>
            <a href="adminRegister.html" class="active">Admin Register</a>
        </nav>

    </header>


    <main class="main-content">

        <form id="register-container" novalidate>

            <span class="register-badge">CineVerse</span>

            <h1 class="register-title">Create Account</h1>

            <p class="register-description">
                Join CineVerse and book your favorite movies.
            </p>


            <!-- Full Name -->
            <div class="form-group">

                <label for="fullname">Full Name</label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                >

                <p id="fullname-error" class="field-error"></p>

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                >

                <p id="email-error" class="field-error"></p>

            </div>


            <!-- Phone Number -->
            <div class="form-group">

                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    
                >

                <p id="phone-error" class="field-error"></p>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                >

                <p id="password-error" class="field-error"></p>

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirm-password">Confirm Password</label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    
                >

                <p id="confirm-password-error" class="field-error"></p>

            </div>


            <!-- Success Message -->
            <p id="register-message" class="register-message"></p>


            <button type="submit" class="submit-button">
                Create Account
            </button>


            <p class="login-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </form>

    </main>


    <footer class="footer">
        <p>&copy; 2026 CineVerse. All rights reserved.</p>
    </footer>


    <!-- Back to Top Button -->
    <button
        type="button"
        class="back-to-top"
        aria-label="Back to top"
    >
        ↑
    </button>


    <!-- External JavaScript -->
    <script src="./Admin/js/admin-register-validation.js"></script>

</body>

</html>
