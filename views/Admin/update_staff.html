    <div class="main-content">

        <div class="form-container">

            <h1>
                Update Staff
            </h1>

            <form>

                <label for="staff">
                    Select Staff
                </label>

                <select id="staff" name="staff">

                    <option value="">
                        Select Staff
                    </option>

                    <option value="staff1">
                        Staff 1
                    </option>

                    <option value="staff2">
                        Staff 2
                    </option>

                </select>
                <br><br>

                <label for="name">
                    Name
                </label>
                
                <input
                    type="text"
                    id="name"
                    name="name"
                >
                <br><br>


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                >
                <br><br>

                <label for="phone">
                    Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                >
                <br><br>

                <input
                    type="submit"
                    value="Update Staff"
                >

            </form>

        </div>

    </div>
