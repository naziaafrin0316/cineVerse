<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Staff - CineVerse</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <div class="navbar">

        <div class="logo">
            CineVerse
        </div>

        <div class="nav-links">
            <a href="admin_dashboard.html">Dashboard</a>
            <a href="add_staff.html" class="active">Add Staff</a>
            <a href="update_staff.html">Update Staff</a>
            <a href="manage_staff.html">Manage Staff</a>
            <a href="delete_staff.html">Delete Staff</a>
            <a href="manage_customers.html">Manage Customers</a>
        </div>

        <div class="user">
            CineVerse Admin ||
            <a href="../login.html">Logout</a>
        </div>

    </div>

    <!-- Main Content -->
    <div class="main-content">

        <div class="form-container">

            <h1>Add Staff</h1>

            <form>

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" required>

                <label>Gender</label>

                <div class="gender-options">
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>

                <label for="password">Temporary Password</label>
                <input type="password" id="password" name="password" required>

                <input type="submit" value="Add Staff">

            </form>

        </div>

    </div>

    <!-- Footer -->
    <div class="footer">

        <div class="footer-left">
            <h1>CineVerse</h1>

            <p>
                Level 8 of the Bashundhara City Shopping<br>
                Complex at 13/3 Ka, Panthapath, Tejgaon,<br>
                Dhaka 1205
            </p>
        </div>

        <div class="footer-right">
            <h1>Contact</h1>
            <p>cineverse@gmail.com</p>
            <p>017xxxxxxxx</p>
        </div>

    </div>

</body>

</html>
