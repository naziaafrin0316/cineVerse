<!DOCTYPE html>
<html>
<head>
    <title>CineVerse - Login</title>
    <link rel="stylesheet" href="../foodstaff/css/foodstaff.css">
</head>
<body>

    <div class="header">
        <h1 id="logo">CineVerse</h1>
        <p id="tagline">Online Cinema Ticket Booking and Hall Management System</p>
    </div>

    <ul class="navbar">
        <li><a href="home.html">Home</a></li>
        <li><a href="home.html#about">About</a></li>
        <li><a href="home.html#services">Services</a></li>
        <li><a href="home.html#register">Register</a></li>
        <li><a class="active" href="login.html">Login</a></li>
    </ul>

    <div class="form-container">

        <h2>User Login</h2>

        <form action="#" method="post">
            <fieldset>
                <legend>Login</legend>

                <label for="user">Username / Email:</label><br>
                <input type="text" id="user" name="user" required><br><br>

                <label for="pass">Password:</label><br>
                <input type="password" id="pass" name="pass" required><br><br>

                <label for="usertype">Select User Type:</label><br>
                <input type="radio" id="customer" name="usertype" value="customer">
                <label for="customer">Customer</label><br>
                <input type="radio" id="staff" name="usertype" value="staff">
                <label for="staff">Staff</label><br>
                <input type="radio" id="foodstaff" name="usertype" value="foodstaff">
                <label for="foodstaff">Food Staff</label><br>
                <input type="radio" id="admin" name="usertype" value="admin">
                <label for="admin">Admin</label><br><br>

                <input type="submit" value="Login">
                <input type="reset" value="Clear">
            </fieldset>
        </form>

        <p>New user? <a href="home.html#register">Register here</a></p>

    </div>

</body>
</html>
